<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Capra Compute</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: #0a0a0a;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .container {
      max-width: 480px;
      padding: 2rem;
    }
    .logo {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 1.5rem;
    }
    .tagline {
      font-size: 1.05rem;
      color: #555;
      line-height: 1.6;
    }
    hr {
      border: 0;
      border-top: 1px solid #1a1a1a;
      margin: 2rem 0;
    }
    .contact {
      font-size: 0.8rem;
      color: #333;
    }
    .contact a {
      color: #444;
      text-decoration: none;
    }
    .contact a:hover {
      color: #888;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">Capra Compute</div>
    <p class="tagline">We build things.</p>
    <hr>
    <p class="contact">
      <a href="mailto:hello@capracompute.com">hello@capracompute.com</a>
    </p>
  </div>
</body>
</html>
