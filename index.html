<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Capra Compute</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: #08080a;
      color: #c4c4c8;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .container {
      max-width: 520px;
      padding: 2rem;
    }
    .name {
      font-size: 1.75rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #6b6b76;
      margin-bottom: 2rem;
    }
    .line {
      font-size: 1.1rem;
      font-weight: 400;
      color: #8e8e98;
      line-height: 1.5;
    }
    hr {
      border: 0;
      border-top: 1px solid #1c1c22;
      margin: 2.5rem auto;
      width: 3rem;
    }
    .contact {
      font-size: 0.85rem;
      color: #4a4a54;
    }
    .contact a {
      color: #5c5c66;
      text-decoration: none;
      transition: color 0.2s;
    }
    .contact a:hover {
      color: #8e8e98;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="name">Capra Compute</div>
    <p class="line">Compute infrastructure for science.</p>
    <hr>
    <p class="contact">
      <a href="mailto:hello@capracompute.com">hello@capracompute.com</a>
    </p>
  </div>
</body>
</html>
